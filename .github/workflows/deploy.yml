name: Deploy Django eCommerce to cPanel Subdomain

on:
  push:
    branches:
      - dev
      - main

jobs:
  build-and-deploy:
    name: Build, Verify & Deploy to cPanel Subdomain
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Setup Python Environment
      - name: 🐍 Setup Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      # Step 3: Install Dependencies & Run Integrity Check
      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 Django System Check
        run: |
          python manage.py check

      # Step 4: Deploy to cPanel Subdomain via SSH
      - name: 🚀 Deploy to cPanel via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST || 'crh1.hostwhitelabel.com' }}
          username: ${{ secrets.SSH_USER || 'shopbusk' }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            echo "==> Navigating to application directory..."
            cd ~/ecommerce.shopbusket.com
            echo "==> Pulling latest changes from branch dev..."
            git fetch origin dev
            git reset --hard origin/dev
            echo "==> Activating Python virtual environment..."
            source ~/virtualenv/ecommerce.shopbusket.com/3.10/bin/activate
            echo "==> Installing any updated requirements..."
            pip install -r requirements.txt --quiet
            echo "==> Running Django system checks & migrations..."
            python manage.py check
            python manage.py migrate --noinput
            echo "==> Collecting static assets..."
            python manage.py collectstatic --noinput
            echo "==> Creating Passenger restart marker..."
            mkdir -p tmp
            echo "restart-$(date +%s)" > tmp/restart.txt
            echo "==> Deployment to ecommerce.shopbusket.com completed successfully!"
