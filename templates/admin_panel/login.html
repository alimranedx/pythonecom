<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Back-Office Sign In | PythonEcom RBAC Portal</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
                <div class="text-center mb-4">
                    <div class="rounded-circle bg-primary-subtle text-primary mx-auto mb-3 d-flex align-items-center justify-content-center" style="width: 60px; height: 60px;">
                        <i class="bi bi-shield-lock-fill fs-3"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Back-Office Portal</h3>
                    <p class="text-muted small">Sign in with your staff role credentials</p>
                </div>

                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags|default:'danger' }} small py-2 mb-3">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Staff Username</label>
                        <input type="text" name="username" id="adminUsername" class="form-control" required placeholder="Enter username">
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-semibold">Password</label>
                        <input type="password" name="password" id="adminPassword" class="form-control" required placeholder="Enter password">
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill fw-semibold shadow-sm mb-4">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Access Portal
                    </button>
                </form>

                <!-- One-Click Test Credential Quick Fill -->
                <div class="p-3 bg-light rounded-3 small">
                    <span class="fw-bold text-dark d-block mb-2">⚡ Quick Test Accounts:</span>
                    <div class="d-grid gap-2">
                        <button type="button" class="btn btn-sm btn-outline-dark text-start" onclick="fillCreds('superadmin', 'Admin@12345')">
                            <strong>Super Admin</strong> <span class="badge bg-danger float-end">All Access</span>
                        </button>
                        <button type="button" class="btn btn-sm btn-outline-primary text-start" onclick="fillCreds('catalog_admin', 'Manager@12345')">
                            <strong>Catalog Manager</strong> <span class="badge bg-primary float-end">Catalog Only</span>
                        </button>
                        <button type="button" class="btn btn-sm btn-outline-success text-start" onclick="fillCreds('orders_staff', 'Staff@12345')">
                            <strong>Order Dispatcher</strong> <span class="badge bg-success float-end">Orders Only</span>
                        </button>
                    </div>
                </div>

                <div class="text-center mt-3 small">
                    <a href="{% url 'home' %}" class="text-muted text-decoration-none">
                        <i class="bi bi-arrow-left me-1"></i> Return to Storefront
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function fillCreds(u, p) {
    document.getElementById('adminUsername').value = u;
    document.getElementById('adminPassword').value = p;
}
</script>
</body>
</html>
