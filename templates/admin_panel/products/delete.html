{% extends 'admin_panel/base_admin.html' %}

{% block page_title %}Delete Product{% endblock %}

{% block admin_content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-0 shadow-sm rounded-4 p-4 text-center bg-white">
            <div class="rounded-circle bg-danger-subtle text-danger mx-auto mb-3 d-flex align-items-center justify-content-center" style="width: 64px; height: 64px;">
                <i class="bi bi-trash3 fs-2"></i>
            </div>
            <h4 class="fw-bold text-danger mb-2">Delete Product</h4>
            <p class="text-muted small mb-4">
                Are you sure you want to permanently delete <strong>"{{ product.name }}"</strong>? This action cannot be reversed.
            </p>

            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-2">
                    <a href="{% url 'admin_product_list' %}" class="btn btn-light border px-4">Cancel</a>
                    <button type="submit" class="btn btn-danger px-4">Yes, Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
