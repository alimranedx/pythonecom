<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" width="100%" height="100%">
  <defs>
    <!-- Emblem Bag Gradient -->
    <linearGradient id="logoBagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Handle Gradient -->
    <linearGradient id="logoHandleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Coral Accent Gradient -->
    <linearGradient id="logoAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="50%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <filter id="logoShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1E3A8A" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- ================= EMBLEM (Left: 64x64 area) ================= -->
  <g transform="translate(6, 4)">
    <!-- Handle -->
    <path d="M 23 23 C 23 11 41 11 41 23" 
          fill="none" 
          stroke="url(#logoHandleGrad)" 
          stroke-width="5" 
          stroke-linecap="round" />

    <!-- Bag Body -->
    <rect x="10" y="20" width="44" height="40" rx="12" 
          fill="url(#logoBagGrad)" 
          filter="url(#logoShadow)" />

    <!-- Fold Highlight -->
    <path d="M 15 21 L 49 21 C 45 28 19 28 15 21 Z" 
          fill="#FFFFFF" 
          opacity="0.2" />

    <!-- Dynamic Checkmark -->
    <path d="M 21 40 L 29 47 L 44 32" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="4.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Coral Lightning Sparkle -->
    <path d="M 46 29 C 46.5 25 49 24.5 50 24 C 49 23.5 46.5 23 46 19 C 45.5 23 43 23.5 42 24 C 43 24.5 45.5 25 46 29 Z" 
          fill="url(#logoAccentGrad)" />
  </g>

  <!-- ================= WORDMARK (Right) ================= -->
  <g transform="translate(74, 43)">
    <!-- 'Easy' -->
    <text x="0" y="0" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="28" 
          font-weight="800" 
          letter-spacing="-0.5px" 
          fill="#0F172A">Easy</text>

    <!-- 'Purchase' -->
    <text x="65" y="0" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="28" 
          font-weight="800" 
          letter-spacing="-0.5px" 
          fill="#2563EB">Purchase</text>

    <!-- Accent Coral Dot over letter 'r'/'s' terminal -->
    <circle cx="187" cy="-21" r="3.5" fill="url(#logoAccentGrad)" />

    <!-- Subtitle / Tagline -->
    <text x="2" y="16" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="9" 
          font-weight="700" 
          letter-spacing="2.8px" 
          fill="#64748B">EXPRESS SHOPPING</text>
  </g>
</svg>
