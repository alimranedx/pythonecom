  <text x="660" y="85" font-family="sans-serif" font-size="10" font-weight="bold" fill="#f85606">Sign In</text>
  <circle cx="735" cy="81" r="12" fill="#eff6ff" />
  <text x="731" y="85" font-family="sans-serif" font-size="11" fill="#2563eb">🛒</text>
  <circle cx="743" cy="74" r="5" fill="#ef4444" />
  <text x="741" y="77" font-family="sans-serif" font-size="7" font-weight="bold" fill="#ffffff">3</text>

