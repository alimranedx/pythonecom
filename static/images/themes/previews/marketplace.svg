  <text x="140" y="124" font-family="sans-serif" font-size="10" fill="#475569">Electronics</text>
  <text x="220" y="124" font-family="sans-serif" font-size="10" fill="#475569">Appliances</text>
  <text x="295" y="124" font-family="sans-serif" font-size="10" fill="#475569">Fashion &amp; Apparel</text>
  <text x="405" y="124" font-family="sans-serif" font-size="10" fill="#475569">Beauty &amp; Care</text>
