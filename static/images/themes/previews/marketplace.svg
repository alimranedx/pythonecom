  <rect x="24" y="36" width="100" height="16" rx="8" fill="#f85606" />
  <text x="32" y="48" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff">★ MEGA MARKET</text>
  <text x="135" y="48" font-family="sans-serif" font-size="9" fill="#e2e8f0">🚚 Flash Express Delivery nationwide on orders over ৳500</text>
  <text x="690" y="48" font-family="sans-serif" font-size="9" fill="#cbd5e1">24/7 Helpline: 16263</text>

  <!-- Header -->
  <rect x="0" y="56" width="800" height="50" fill="#ffffff" filter="url(#shadow-sm)" />
  <!-- Logo -->
  <circle cx="45" cy="81" r="14" fill="#f85606" />
  <path d="M40 76 L50 76 L48 85 L42 85 Z" fill="#ffffff" />
  <circle cx="43" cy="87" r="1.5" fill="#ffffff" />
  <circle cx="47" cy="87" r="1.5" fill="#ffffff" />
  <text x="68" y="85" font-family="sans-serif" font-size="16" font-weight="800" fill="#0f172a">MEGA<tspan fill="#f85606">MARKET</tspan></text>
  
  <!-- Search Bar -->
  <rect x="230" y="66" width="340" height="30" rx="15" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" />
  <text x="246" y="85" font-family="sans-serif" font-size="10" fill="#64748b">Search 500,000+ products across all categories...</text>
  <rect x="510" y="67" width="58" height="28" rx="14" fill="#f85606" />
  <text x="525" y="85" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">Search</text>

