    <rect x="16" y="14" width="38" height="14" rx="7" fill="#ef4444" />
    <text x="22" y="24" font-family="sans-serif" font-size="7" font-weight="bold" fill="#ffffff">-40%</text>
    <text x="14" y="112" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1e293b">Ultra Breathable Runners</text>
    <text x="14" y="126" font-family="sans-serif" font-size="9" fill="#64748b">Lightweight Air Cushion</text>
    <text x="14" y="146" font-family="sans-serif" font-size="12" font-weight="800" fill="#f85606">৳1,950</text>
    <text x="62" y="146" font-family="sans-serif" font-size="9" text-decoration="line-through" fill="#94a3b8">৳3,250</text>
    <rect x="120" y="132" width="44" height="22" rx="4" fill="#f85606" />
    <text x="131" y="146" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff">Add</text>
  </g>

  <!-- Product Card 4 -->
  <g transform="translate(600, 328)">
    <rect width="176" height="170" rx="8" fill="url(#card-grad)" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow-sm)" />
    <rect x="12" y="10" width="152" height="85" rx="6" fill="#f1f5f9" />
    <text x="76" y="58" font-size="28" text-anchor="middle">🎒</text>
    <rect x="16" y="14" width="38" height="14" rx="7" fill="#ef4444" />
    <text x="22" y="24" font-family="sans-serif" font-size="7" font-weight="bold" fill="#ffffff">-25%</text>
    <text x="14" y="112" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1e293b">Ergonomic Commuter Bag</text>
    <text x="14" y="126" font-family="sans-serif" font-size="9" fill="#64748b">Waterproof Nylon Shell</text>
    <text x="14" y="146" font-family="sans-serif" font-size="12" font-weight="800" fill="#f85606">৳1,450</text>
    <text x="62" y="146" font-family="sans-serif" font-size="9" text-decoration="line-through" fill="#94a3b8">৳1,950</text>
    <rect x="120" y="132" width="44" height="22" rx="4" fill="#f85606" />
    <text x="131" y="146" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff">Add</text>
