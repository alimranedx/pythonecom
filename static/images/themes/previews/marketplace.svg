    <text x="14" y="146" font-family="sans-serif" font-size="12" font-weight="800" fill="#f85606">৳2,850</text>
    <text x="62" y="146" font-family="sans-serif" font-size="9" text-decoration="line-through" fill="#94a3b8">৳4,200</text>
