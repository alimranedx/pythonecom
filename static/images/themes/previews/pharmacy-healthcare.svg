    <text x="14" y="112" font-family="sans-serif" font-size="10" font-weight="bold" fill="#134e4a">Maxpro 20mg Tablet</text>
    <text x="14" y="126" font-family="sans-serif" font-size="8.5" fill="#0f766e">Esomeprazole • Box of 10 Strips</text>
    <text x="14" y="146" font-family="sans-serif" font-size="12" font-weight="800" fill="#059669">৳70</text>
    <rect x="110" y="132" width="54" height="22" rx="11" fill="#059669" />
    <text x="122" y="146" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff">+ Add</text>
  </g>

  <!-- Product 4 -->
  <g transform="translate(600, 328)">
    <rect width="176" height="170" rx="10" fill="url(#card-pharma)" stroke="#99f6e4" stroke-width="1" filter="url(#pharma-shadow)" />
    <rect x="12" y="10" width="152" height="85" rx="8" fill="#f0fdfa" />
    <text x="76" y="58" font-size="28" text-anchor="middle">🩺</text>
    <rect x="16" y="14" width="50" height="14" rx="7" fill="#047857" />
    <text x="20" y="24" font-family="sans-serif" font-size="7" font-weight="bold" fill="#ffffff">OMRON</text>
    <text x="14" y="112" font-family="sans-serif" font-size="10" font-weight="bold" fill="#134e4a">Digital Blood Pressure</text>
    <text x="14" y="126" font-family="sans-serif" font-size="8.5" fill="#0f766e">IntelliSense • 3-Yr Warranty</text>
    <text x="14" y="146" font-family="sans-serif" font-size="12" font-weight="800" fill="#059669">৳3,450</text>
    <rect x="110" y="132" width="54" height="22" rx="11" fill="#059669" />
    <text x="122" y="146" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff">+ Add</text>
