<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="pharma-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdfa" />
      <stop offset="50%" stop-color="#ccfbf1" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="pharma-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="card-pharma" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdfa" />
    </linearGradient>
    <filter id="pharma-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f766e" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Browser Frame -->
  <rect width="800" height="520" rx="12" fill="#134e4a" />
  
  <!-- Window Header -->
  <circle cx="24" cy="18" r="5" fill="#ef4444" />
  <circle cx="38" cy="18" r="5" fill="#f59e0b" />
  <circle cx="52" cy="18" r="5" fill="#10b981" />
  <rect x="75" y="9" width="390" height="18" rx="5" fill="#042f2e" />
  <text x="85" y="22" font-family="-apple-system,sans-serif" font-size="10" fill="#99f6e4">https://easypurchase.com/pharmacy-healthcare • Arogga Style (Flagship)</text>

  <!-- Canvas -->
  <rect x="0" y="32" width="800" height="488" fill="url(#pharma-bg)" />

  <!-- Top Announcement Bar -->
