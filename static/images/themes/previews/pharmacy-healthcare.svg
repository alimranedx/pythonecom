  <rect x="24" y="36" width="120" height="16" rx="8" fill="#059669" />
  <text x="32" y="48" font-family="sans-serif" font-size="8.5" font-weight="bold" fill="#ffffff">⚕️ DGDA CERTIFIED RX</text>
  <text x="155" y="48" font-family="sans-serif" font-size="9" fill="#ccfbf1">100% Genuine Medicine • Cold Chain Storage (2°-8°C) • Licensed Pharmacists</text>
  <text x="690" y="48" font-family="sans-serif" font-size="9" fill="#5eead4">Rx Doctor Helpline: 16263</text>

  <!-- Header -->
  <rect x="0" y="56" width="800" height="50" fill="#ffffff" filter="url(#pharma-shadow)" />
  <!-- Logo -->
  <circle cx="45" cy="81" r="14" fill="#ccfbf1" />
  <text x="38" y="86" font-family="sans-serif" font-size="14" fill="#0f766e">💊</text>
  <text x="68" y="85" font-family="sans-serif" font-size="16" font-weight="800" fill="#134e4a">AROGYA<tspan fill="#059669">PHARMA</tspan></text>
  
  <!-- Prescription Upload Highlight Button (Arogga Feature) -->
  <rect x="200" y="66" width="140" height="30" rx="15" fill="#0f766e" />
  <text x="214" y="85" font-family="sans-serif" font-size="9.5" font-weight="bold" fill="#ffffff">📋 Order with Prescription</text>

