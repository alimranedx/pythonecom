  <text x="364" y="85" font-family="sans-serif" font-size="10" fill="#0f766e">Search medicine name or generic (e.g. Paracetamol)...</text>
  <rect x="575" y="67" width="52" height="28" rx="14" fill="#059669" />
  <text x="586" y="85" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">Search</text>

  <!-- Header Controls -->
