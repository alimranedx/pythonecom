  <text x="145" y="124" font-family="sans-serif" font-size="10" fill="#134e4a">Diabetes Care &amp; Insulin</text>
  <text x="295" y="124" font-family="sans-serif" font-size="10" fill="#134e4a">Cardiac &amp; BP Monitors</text>
  <text x="440" y="124" font-family="sans-serif" font-size="10" fill="#134e4a">Baby Health &amp; Diapers</text>
  <text x="585" y="124" font-family="sans-serif" font-size="10" fill="#134e4a">Vitamins &amp; Supplements</text>
