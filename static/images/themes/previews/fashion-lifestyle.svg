      <stop offset="0%" stop-color="#9a3412" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="fl-hero-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fefce8" />
      <stop offset="50%" stop-color="#fff7ed" />
      <stop offset="100%" stop-color="#ffedd5" />
    </linearGradient>
    <linearGradient id="fl-portrait-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12" />
      <stop offset="55%" stop-color="#9a3412" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="fl-portrait-overlay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" stop-opacity="0" />
