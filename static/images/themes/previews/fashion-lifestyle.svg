  <text x="735" y="318" font-family="sans-serif" font-size="10" font-weight="bold" fill="#b45309">Discover All &gt;</text>

  <!-- Product 1 -->
  <g transform="translate(24, 328)">
    <rect width="176" height="170" rx="6" fill="url(#card-fashion)" stroke="#e4e4e7" stroke-width="1" filter="url(#fashion-shadow)" />
    <rect x="12" y="10" width="152" height="85" rx="4" fill="#fef3c7" />
    <text x="76" y="58" font-size="28" text-anchor="middle">🥻</text>
    <rect x="16" y="14" width="46" height="14" rx="2" fill="#78350f" />
    <text x="20" y="24" font-family="sans-serif" font-size="7" font-weight="bold" fill="#ffffff">HANDLOOM</text>
    <text x="14" y="112" font-family="sans-serif" font-size="10" font-weight="bold" fill="#18181b">Royal Jamdani Saree</text>
    <text x="14" y="126" font-family="sans-serif" font-size="8.5" fill="#71717a">Zari Thread Embroidery</text>
    <text x="14" y="146" font-family="sans-serif" font-size="12" font-weight="800" fill="#b45309">৳14,500</text>
    <rect x="120" y="132" width="44" height="22" rx="3" fill="#78350f" />
    <text x="131" y="146" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff">View</text>
  </g>

  <!-- Product 2 -->
  <g transform="translate(216, 328)">
    <rect width="176" height="170" rx="6" fill="url(#card-fashion)" stroke="#e4e4e7" stroke-width="1" filter="url(#fashion-shadow)" />
    <rect x="12" y="10" width="152" height="85" rx="4" fill="#fef3c7" />
    <text x="76" y="58" font-size="28" text-anchor="middle">👔</text>
    <rect x="16" y="14" width="40" height="14" rx="2" fill="#b45309" />
    <text x="20" y="24" font-family="sans-serif" font-size="7" font-weight="bold" fill="#ffffff">SLIM FIT</text>
    <text x="14" y="112" font-family="sans-serif" font-size="10" font-weight="bold" fill="#18181b">Embroidered Cotton Panjabi</text>
    <text x="14" y="126" font-family="sans-serif" font-size="8.5" fill="#71717a">Mandarin Collar with Metal Buttons</text>
    <text x="14" y="146" font-family="sans-serif" font-size="12" font-weight="800" fill="#b45309">৳4,250</text>
    <rect x="120" y="132" width="44" height="22" rx="3" fill="#78350f" />
    <text x="131" y="146" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff">View</text>
  </g>

  <!-- Product 3 -->
  <g transform="translate(408, 328)">
    <rect width="176" height="170" rx="6" fill="url(#card-fashion)" stroke="#e4e4e7" stroke-width="1" filter="url(#fashion-shadow)" />
    <rect x="12" y="10" width="152" height="85" rx="4" fill="#fef3c7" />
    <text x="76" y="58" font-size="28" text-anchor="middle">👗</text>
    <rect x="16" y="14" width="44" height="14" rx="2" fill="#047857" />
    <text x="20" y="24" font-family="sans-serif" font-size="7" font-weight="bold" fill="#ffffff">ORGANIC</text>
    <text x="14" y="112" font-family="sans-serif" font-size="10" font-weight="bold" fill="#18181b">Printed Floral Lawn Kurti</text>
    <text x="14" y="126" font-family="sans-serif" font-size="8.5" fill="#71717a">100% Breathable Combed Cotton</text>
    <text x="14" y="146" font-family="sans-serif" font-size="12" font-weight="800" fill="#b45309">৳2,850</text>
    <rect x="120" y="132" width="44" height="22" rx="3" fill="#78350f" />
    <text x="131" y="146" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff">View</text>
  </g>

  <!-- Product 4 -->
  <g transform="translate(600, 328)">
    <rect width="176" height="170" rx="6" fill="url(#card-fashion)" stroke="#e4e4e7" stroke-width="1" filter="url(#fashion-shadow)" />
    <rect x="12" y="10" width="152" height="85" rx="4" fill="#fef3c7" />
    <text x="76" y="58" font-size="28" text-anchor="middle">👞</text>
    <rect x="16" y="14" width="46" height="14" rx="2" fill="#18181b" />
    <text x="20" y="24" font-family="sans-serif" font-size="7" font-weight="bold" fill="#ffffff">LEATHER</text>
    <text x="14" y="112" font-family="sans-serif" font-size="10" font-weight="bold" fill="#18181b">Full-Grain Leather Loafers</text>
    <text x="14" y="126" font-family="sans-serif" font-size="8.5" fill="#71717a">Cushioned Insole &amp; Stitch Detail</text>
    <text x="14" y="146" font-family="sans-serif" font-size="12" font-weight="800" fill="#b45309">৳5,600</text>
    <rect x="120" y="132" width="44" height="22" rx="3" fill="#78350f" />
    <text x="131" y="146" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff">View</text>
  </g>
</svg>