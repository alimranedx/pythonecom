<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="fashion-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="50%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="fashion-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="card-fashion" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fffdf5" />
    </linearGradient>
    <filter id="fashion-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#78350f" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Browser Frame -->
  <rect width="800" height="520" rx="12" fill="#18181b" />
  
  <!-- Window Header -->
  <circle cx="24" cy="18" r="5" fill="#ef4444" />
  <circle cx="38" cy="18" r="5" fill="#f59e0b" />
  <circle cx="52" cy="18" r="5" fill="#10b981" />
  <rect x="75" y="9" width="370" height="18" rx="5" fill="#27272a" />
  <text x="85" y="22" font-family="-apple-system,sans-serif" font-size="10" fill="#a1a1aa">https://easypurchase.com/fashion-lifestyle • Aarong &amp; Sailor Style</text>

  <!-- Canvas -->
  <rect x="0" y="32" width="800" height="488" fill="url(#fashion-bg)" />

  <!-- Top Announcement Bar -->
  <rect x="0" y="32" width="800" height="24" fill="#27272a" />
  <rect x="24" y="36" width="100" height="16" rx="3" fill="#b45309" />
  <text x="32" y="48" font-family="sans-serif" font-size="8.5" font-weight="bold" fill="#ffffff">⚜️ HERITAGE LOOK</text>
  <text x="135" y="48" font-family="sans-serif" font-size="9" fill="#e4e4e7">Handcrafted Fabrics • Free 7-Day Exchange &amp; Return • Exclusive Eid Edits</text>
  <text x="690" y="48" font-family="sans-serif" font-size="9" fill="#d4d4d8">VIP Concierge: 16400</text>

  <!-- Header -->
  <rect x="0" y="56" width="800" height="50" fill="#ffffff" filter="url(#fashion-shadow)" />
  <!-- Logo -->
  <circle cx="45" cy="81" r="14" fill="#fef3c7" stroke="#b45309" stroke-width="1" />
  <text x="39" y="86" font-family="sans-serif" font-size="14" fill="#78350f">⚜️</text>
  <text x="68" y="85" font-family="'Times New Roman',Georgia,serif" font-size="18" font-weight="bold" fill="#18181b">AURA<tspan fill="#b45309">MODA</tspan></text>
  
  <!-- Navigation Links in Header (Sailor Style) -->
  <text x="210" y="85" font-family="sans-serif" font-size="10" font-weight="bold" fill="#18181b">MEN</text>
  <text x="255" y="85" font-family="sans-serif" font-size="10" font-weight="bold" fill="#18181b">WOMEN</text>
  <text x="315" y="85" font-family="sans-serif" font-size="10" font-weight="bold" fill="#18181b">KIDS</text>
  <text x="360" y="85" font-family="sans-serif" font-size="10" font-weight="bold" fill="#b45309">EID COLLECTION '26</text>
  <text x="490" y="85" font-family="sans-serif" font-size="10" fill="#71717a">LOOKBOOK</text>

  <!-- Search & Wishlist & Bag -->
  <rect x="580" y="67" width="100" height="28" rx="4" fill="#f4f4f5" />
  <text x="590" y="84" font-family="sans-serif" font-size="9" fill="#a1a1aa">🔍 Search style...</text>
  <circle cx="705" cy="81" r="12" fill="#fffbeb" />
  <text x="701" y="85" font-family="sans-serif" font-size="11" fill="#b45309">🤍</text>
  <circle cx="740" cy="81" r="12" fill="#fef3c7" />
  <text x="736" y="85" font-family="sans-serif" font-size="11" fill="#78350f">👜</text>
  <circle cx="748" cy="74" r="5" fill="#b45309" />
  <text x="746" y="77" font-family="sans-serif" font-size="7" font-weight="bold" fill="#ffffff">2</text>

  <!-- Categories Strip -->
  <rect x="0" y="106" width="800" height="28" fill="#ffffff" stroke="#f4f4f5" stroke-width="1" />
  <text x="24" y="124" font-family="sans-serif" font-size="10" font-weight="bold" fill="#b45309">Premium Panjabi</text>
  <text x="140" y="124" font-family="sans-serif" font-size="10" fill="#27272a">Muslin &amp; Jamdani Saree</text>
  <text x="290" y="124" font-family="sans-serif" font-size="10" fill="#27272a">Casual Shirts &amp; Chinos</text>
  <text x="430" y="124" font-family="sans-serif" font-size="10" fill="#27272a">Footwear &amp; Leather</text>
  <text x="560" y="124" font-family="sans-serif" font-size="10" fill="#27272a">Handcrafted Jewelry</text>
  <rect x="705" y="111" width="70" height="18" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1" />
  <text x="715" y="123" font-family="sans-serif" font-size="8" font-weight="bold" fill="#78350f">NEW ARRIVALS</text>

  <!-- Hero Section (Editorial Lookbook Style) -->
  <rect x="24" y="144" width="752" height="150" rx="8" fill="url(#fashion-grad)" filter="url(#fashion-shadow)" />
  
  <rect x="44" y="162" width="125" height="18" rx="3" fill="#ffffff" fill-opacity="0.2" />
  <text x="52" y="174" font-family="sans-serif" font-size="8.5" font-weight="bold" fill="#ffffff">LIMITED FESTIVE DROP</text>
  <text x="44" y="210" font-family="'Times New Roman',Georgia,serif" font-size="22" font-weight="bold" fill="#ffffff">The Art of Contemporary Elegance</text>
  <text x="44" y="228" font-family="sans-serif" font-size="11" fill="#fef3c7">Handwoven breathable cottons, jacquard motifs &amp; timeless craftsmanship.</text>

  <rect x="44" y="246" width="115" height="30" rx="4" fill="#ffffff" />
  <text x="56" y="265" font-family="sans-serif" font-size="10" font-weight="bold" fill="#78350f">Shop Collection →</text>
  <rect x="170" y="246" width="105" height="30" rx="4" fill="#18181b" fill-opacity="0.4" stroke="#ffffff" stroke-width="1" />
  <text x="182" y="265" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">View Lookbook</text>

  <!-- Hero Imagery -->
  <g transform="translate(570, 155)">
    <rect width="170" height="128" rx="6" fill="#fef3c7" stroke="#ffffff" stroke-width="1" />
    <text x="85" y="65" font-size="34" text-anchor="middle">👘</text>
    <rect x="25" y="98" width="120" height="18" rx="3" fill="#78350f" />
    <text x="35" y="110" font-family="sans-serif" font-size="8" font-weight="bold" fill="#ffffff">Handloom Silk Blend</text>
  </g>

