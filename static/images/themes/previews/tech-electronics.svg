    <text x="14" y="112" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">MacBook Pro 16" M3</text>
    <text x="14" y="126" font-family="sans-serif" font-size="8.5" fill="#38bdf8">36GB Unified RAM • 1TB SSD</text>
    <text x="14" y="146" font-family="sans-serif" font-size="12" font-weight="800" fill="#38bdf8">৳325,000</text>
    <rect x="120" y="132" width="44" height="22" rx="4" fill="#2563eb" />
    <text x="131" y="146" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff">Buy</text>
  </g>

  <!-- Product 3 -->
  <g transform="translate(408, 328)">
    <rect width="176" height="170" rx="8" fill="url(#card-dark)" stroke="#334155" stroke-width="1" />
    <rect x="12" y="10" width="152" height="85" rx="6" fill="#0b1120" />
    <text x="76" y="58" font-size="28" text-anchor="middle">🎮</text>
    <rect x="16" y="14" width="44" height="14" rx="3" fill="#dc2626" />
    <text x="20" y="24" font-family="sans-serif" font-size="7" font-weight="bold" fill="#ffffff">HOT DEAL</text>
    <text x="14" y="112" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">PlayStation 5 Slim 1TB</text>
    <text x="14" y="126" font-family="sans-serif" font-size="8.5" fill="#38bdf8">DualSense Wireless • 4K HDR</text>
    <text x="14" y="146" font-family="sans-serif" font-size="12" font-weight="800" fill="#38bdf8">৳64,500</text>
    <rect x="120" y="132" width="44" height="22" rx="4" fill="#2563eb" />
    <text x="131" y="146" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff">Buy</text>
  </g>

  <!-- Product 4 -->
  <g transform="translate(600, 328)">
    <rect width="176" height="170" rx="8" fill="url(#card-dark)" stroke="#334155" stroke-width="1" />
    <rect x="12" y="10" width="152" height="85" rx="6" fill="#0b1120" />
    <text x="76" y="58" font-size="28" text-anchor="middle">🖥️</text>
    <rect x="16" y="14" width="44" height="14" rx="3" fill="#7c3aed" />
    <text x="22" y="24" font-family="sans-serif" font-size="7" font-weight="bold" fill="#ffffff">165Hz</text>
    <text x="14" y="112" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">27" 2K OLED Gaming Display</text>
    <text x="14" y="126" font-family="sans-serif" font-size="8.5" fill="#38bdf8">0.03ms GtG • G-Sync Ready</text>
    <text x="14" y="146" font-family="sans-serif" font-size="12" font-weight="800" fill="#38bdf8">৳58,900</text>
    <rect x="120" y="132" width="44" height="22" rx="4" fill="#2563eb" />
    <text x="131" y="146" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff">Buy</text>
