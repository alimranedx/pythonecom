  <text x="135" y="124" font-family="sans-serif" font-size="10" fill="#94a3b8">RTX 40-Series</text>
  <text x="235" y="124" font-family="sans-serif" font-size="10" fill="#94a3b8">Flagship Phones</text>
  <text x="345" y="124" font-family="sans-serif" font-size="10" fill="#94a3b8">Mechanical Keyboards</text>
  <text x="490" y="124" font-family="sans-serif" font-size="10" fill="#94a3b8">4K Monitors</text>
  <text x="590" y="124" font-family="sans-serif" font-size="10" fill="#94a3b8">Audio &amp; DACs</text>
