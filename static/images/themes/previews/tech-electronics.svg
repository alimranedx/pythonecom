<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="tech-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="tech-primary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="neon-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="card-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Browser Frame -->
  <rect width="800" height="520" rx="12" fill="#030712" />
  
  <!-- Window Header -->
  <circle cx="24" cy="18" r="5" fill="#ef4444" />
  <circle cx="38" cy="18" r="5" fill="#f59e0b" />
  <circle cx="52" cy="18" r="5" fill="#10b981" />
  <rect x="75" y="9" width="370" height="18" rx="5" fill="#111827" />
  <text x="85" y="22" font-family="-apple-system,sans-serif" font-size="10" fill="#64748b">https://easypurchase.com/tech-electronics • Star Tech &amp; Apple Style</text>

  <!-- Store Canvas (Dark Futuristic Tech) -->
  <rect x="0" y="32" width="800" height="488" fill="url(#tech-bg)" />

  <!-- Top Announcement Bar -->
  <rect x="0" y="32" width="800" height="24" fill="#030712" />
  <rect x="24" y="36" width="95" height="16" rx="8" fill="#2563eb" />
  <text x="32" y="48" font-family="sans-serif" font-size="8.5" font-weight="bold" fill="#ffffff">⚡ TECH HUB</text>
  <text x="130" y="48" font-family="sans-serif" font-size="9" fill="#94a3b8">Official Brand Warranty • 0% EMI up to 12 Months • 3-Hour Dhaka Delivery</text>
  <text x="690" y="48" font-family="sans-serif" font-size="9" fill="#38bdf8">Tech Support: 16800</text>

  <!-- Header -->
  <rect x="0" y="56" width="800" height="50" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  <!-- Logo -->
  <rect x="24" y="67" width="28" height="28" rx="6" fill="#2563eb" filter="url(#glow)" />
  <text x="31" y="86" font-family="sans-serif" font-size="16" fill="#ffffff">⚡</text>
  <text x="60" y="85" font-family="sans-serif" font-size="16" font-weight="800" fill="#ffffff">CYBER<tspan fill="#38bdf8">TECH</tspan></text>
  
  <!-- Search Bar with Category Dropdown -->
  <rect x="220" y="66" width="360" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="236" y="85" font-family="sans-serif" font-size="10" fill="#94a3b8">Search laptops, graphics cards, smartphones, consoles...</text>
  <rect x="525" y="67" width="54" height="28" rx="5" fill="#2563eb" />
  <text x="536" y="85" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">Search</text>

  <!-- Header Controls -->
  <rect x="630" y="70" width="75" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="638" y="85" font-family="sans-serif" font-size="9" font-weight="bold" fill="#38bdf8">PC Builder</text>
  <circle cx="730" cy="81" r="12" fill="#1e293b" />
  <text x="726" y="85" font-family="sans-serif" font-size="11" fill="#38bdf8">🛒</text>
  <circle cx="738" cy="74" r="5" fill="#ef4444" />
