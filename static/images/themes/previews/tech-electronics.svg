  <text x="44" y="228" font-family="sans-serif" font-size="11" fill="#94a3b8">Equip your setup with state-of-the-art silicon, OLED displays &amp; AI accelerators.</text>

  <rect x="44" y="246" width="120" height="30" rx="6" fill="#2563eb" filter="url(#glow)" />
  <text x="58" y="265" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Explore Gadgets →</text>
