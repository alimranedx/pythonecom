<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background / Bag Gradient -->
    <linearGradient id="epBagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Handle Gradient -->
    <linearGradient id="epHandleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Coral Sparkle / Check Accent Gradient -->
    <linearGradient id="epAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="50%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="epShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1E3A8A" flood-opacity="0.35" />
    </filter>

    <filter id="epGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#E11D48" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Bag Handle -->
  <path d="M 46 44 C 46 25 82 25 82 44" 
        fill="none" 
        stroke="url(#epHandleGrad)" 
        stroke-width="9" 
        stroke-linecap="round" />

  <!-- Main Bag Body with Soft Curve Geometry -->
  <rect x="22" y="38" width="84" height="76" rx="22" 
        fill="url(#epBagGrad)" 
        filter="url(#epShadow)" />

  <!-- Interior Dynamic Fold / Highlights -->
  <path d="M 32 40 L 96 40 C 90 52 38 52 32 40 Z" 
        fill="#FFFFFF" 
        opacity="0.16" />

  <!-- Express Speed Wing / Verification Checkmark & Star -->
  <g filter="url(#epGlow)">
    <!-- Express Swoosh Check -->
    <path d="M 43 75 L 56 87 L 85 58" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="9" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    
    <!-- Accent Lightning Sparkle at the top right of the check -->
    <path d="M 87 54 C 88 47 93 46 95 45 C 93 44 88 43 87 36 C 86 43 81 44 79 45 C 81 46 86 47 87 54 Z" 
          fill="url(#epAccentGrad)" />
  </g>
</svg>
